# Shared LaTeX settings for both handout PDFs.
#
# xelatex + DejaVu is deliberate: the notes use arrows and symbols (⟵, ⟿, the
# cue labels) that the default Latin Modern fonts do not carry. The diagrams
# use DejaVu Sans too, so text and figures match.
mainfont: "DejaVu Serif"
sansfont: "DejaVu Sans"
monofont: "DejaVu Sans Mono"
fontsize: 11pt
papersize: a4
geometry:
  - margin=2.5cm
linkcolor: RoyalBlue
urlcolor: RoyalBlue
colorlinks: true
toc: true
toc-depth: 2
